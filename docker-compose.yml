version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: store_intelligence
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/setup_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d store_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://admin:admin@postgres:5432/store_intelligence
      - REDIS_URL=redis://redis:6379

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "3000:80"
    depends_on:
      - api

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    command: ["python", "-m", "events.consumer"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://admin:admin@postgres:5432/store_intelligence
      - REDIS_URL=redis://redis:6379

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    volumes:
      - ./data/videos:/app/data/videos:ro
      - ./data/pos:/app/data/pos:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
      consumer:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://admin:admin@postgres:5432/store_intelligence
      - REDIS_URL=redis://redis:6379
      - API_URL=http://api:8000
    # The pipeline can be triggered to run or it can run immediately. Let's make it run on startup.

volumes:
  pgdata:
