# Global Settings for Store Intelligence System

store:
  store_id: "ST1008"
  store_name: "Brigade_Bangalore"
  city: "Bangalore"
  date: "2026-04-10"

pipeline:
  # Detection
  detection_model: "yolov8n.pt"
  detection_confidence: 0.4
  detection_classes: [0]  # 0 = person in COCO

  # Tracking
  track_activation_threshold: 0.4
  lost_track_buffer: 30  # frames
  minimum_matching_threshold: 0.8

  # Processing
  batch_size: 16
  use_gpu: true
  max_workers: 4  # parallel camera processing

  # Edge cases
  staff_presence_threshold: 0.75  # Track present >75% of video = staff
  reentry_time_window_minutes: 30
  reentry_appearance_threshold: 0.7  # Color histogram similarity
  group_time_window_seconds: 3
  group_proximity_pixels: 150  # In original frame coordinates
  min_dwell_seconds: 5  # Minimum time to count as a zone visit
  child_height_ratio: 0.6  # Below 60% avg adult bbox height

database:
  url: "postgresql://admin:admin@postgres:5432/store_intelligence"

redis:
  url: "redis://redis:6379"
  stream_name: "store_events"
  consumer_group: "analytics"

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["http://localhost:3000", "http://dashboard:80"]

logging:
  level: "INFO"
  format: "json"
